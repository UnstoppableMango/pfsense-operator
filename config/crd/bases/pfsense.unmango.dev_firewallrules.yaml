                      available when the following conditions are met:<br>- `protocol`
                      must be one of [ tcp, udp, tcp/udp ]<br>'
                    type: string
                  statetype:
                    description: Statetype The state mechanism to use for this firewall
                      rule.<br>
                    type: string
                  tag:
                    description: Tag A packet matching this rule can be marked and
                      this mark used to match on other NAT/filter rules. It is called
                      <br>
                    type: string
                  tcp_flags_any:
                    description: TcpFlagsAny Allow any TCP flags.<br>
                    type: boolean
                  tcp_flags_out_of:
                    description: TcpFlagsOutOf The TCP flags that can be set for this

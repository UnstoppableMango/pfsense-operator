                    description: Ipprotocol The IP version(s) this rule applies to.<br>
                    type: string
                  log:
                    description: Log Enable or disable logging of traffic that matches
                      this rule.<br>
                    type: boolean
                  pdnpipe:
                    description: Pdnpipe The name of the traffic shaper limiter pipe
                      or queue to use for outgoing traffic.<br>
                    type: string
                  protocol:
                    description: Protocol The IP/transport protocol this rule should
                      match.<br>
                    type: string
                  quick:
                    description: Quick Apply this action to traffic that matches this
                      rule immediately. This field only applies to floating firewall
                      rules.<br><br>This field is only available when the following
                      conditions are met:<br>- `floating` must be equal to `true`<br>
                    type: boolean

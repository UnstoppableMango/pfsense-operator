                properties:
                  ackqueue:
                    description: Ackqueue The name of the traffic shaper queue to
                      assume as the ACK queue for ACK traffic matching this rule.<br>
                    type: string
                  associated_rule_id:
                    description: AssociatedRuleId The internal rule ID for the NAT
                      rule associated with this rule.<br>
                    type: string
                  created_by:
                    description: CreatedBy The username and IP of the user who originally
                      created this firewall rule.<br>
                    type: string
                  created_time:
                    description: CreatedTime The unix timestamp of when this firewall
                      rule was original created.<br>
                    type: integer
                  defaultqueue:
                    description: Defaultqueue The name of the traffic shaper queue
                      to assume as the default queue for traffic matching this rule.<br>
                    type: string
                  descr:
                    description: Descr A description detailing the purpose or justification
                      of this firewall rule.<br>
                    type: string
                  destination:
                    description: 'Destination The destination address this rule applies
                      to. Valid value options are: an existing interface, an IP address,
                      a subnet CIDR, an existing alias, `any`, `(self)`, `l2tp`, `pppoe`.
                      The context of this address can be inverted by prefixing the
                      value with `!`. For interface values, the `:ip`  modifier can
                      be appended to the value to use the interface''s IP address
                      instead of its entire subnet.<br>'
                    type: string
                  destination_port:
                    description: 'DestinationPort The destination port this rule applies
                      to. Set to `null` to allow any destination port. Valid options

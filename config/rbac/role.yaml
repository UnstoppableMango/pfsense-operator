---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - pfsense.unmango.dev
  resources:
  - firewallrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pfsense.unmango.dev
  resources:
  - firewallrules/finalizers
  verbs:
  - update
- apiGroups:
  - pfsense.unmango.dev
  resources:
  - firewallrules/status
  verbs:
  - get
  - patch
  - update
